# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
#
# Run: cargo deny check  (or: just deny)

[advisories]
ignore = [
    "RUSTSEC-2025-0141",
    "RUSTSEC-2024-0436",
    # quick-xml <0.41 — duplicate-attribute quadratic run time (0194) and
    # NsReader namespace-allocation DoS (0195), fixed in >=0.41. Transitive
    # via object_store (semver-locked upstream); no fix path until upstream
    # moves. XML surface is the storage provider's own API responses; both
    # advisories are DoS-class. Added 2026-07-02.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "NCSA",
    "Unlicense",
]

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "allow"  # We use git deps (llama-burn)
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
